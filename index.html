<title>Dila_Shopping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e3b3ad;--ink:#4a2418;--muted:#5f3d33;--line:#5a2d1f;--card:#e3b3ad;--pink:#e9a9c9;--leaf:#6f9f5f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:0 32px 40px;position:relative}
.deco{position:absolute;top:0;left:0;right:0;height:130px;overflow:hidden;pointer-events:none}
.deco svg{position:absolute;width:90px;height:90px}
.logo{width:230px;max-width:80%;aspect-ratio:461/412;border-radius:28px;background:#fef9f6;margin:44px auto 0;display:block;position:relative;object-fit:contain}
h1{font:700 34px/1.15 "Fraunces",Georgia,serif;text-align:center;margin:28px 0 8px}
p.bio{text-align:center;color:var(--muted);font-size:19px;line-height:1.45;margin:0 0 26px}
a.btn{display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 16px;margin-bottom:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;border-radius:3px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a.btn:hover{background:var(--line);color:#fff}
a.btn svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
a.btn i.ico{font-style:normal;font-size:30px;line-height:34px;width:34px;text-align:center;flex:none}
a.btn span{flex:1;text-align:center;padding-right:34px}
a.btn b{display:block;font:700 22px/1.2 "Fraunces",Georgia,serif}
a.btn small{display:block;color:var(--muted);font-size:16px}
a.btn:hover small{color:#fff}
.gap{height:18px}
.side{position:absolute;left:0;right:0;top:410px;bottom:150px;pointer-events:none;z-index:0}
.side svg{position:absolute}
a.btn{position:relative;z-index:1}
body{overflow-x:hidden}
.shelf{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-top:34px}
.shelf svg{width:48px;height:48px;flex:none}
.logo{z-index:1}
</style>
</head>
